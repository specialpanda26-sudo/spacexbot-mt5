services:
  - type: web
    name: spacexbot-mt5
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # ONE worker only: candle data is kept in memory
    startCommand: gunicorn backend.app:app -b 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /healthz
