services:
  - type: web
    name: spacexbot-mt5
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # ONE worker only: candle data is kept in memory
    startCommand: gunicorn backend.app:app -b 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /healthz
    envVars:
      - key: FEED_ON          # phone-only: the server finds signals itself, no EA needed
        value: "1"
