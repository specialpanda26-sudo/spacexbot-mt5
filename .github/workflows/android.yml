name: Build Android APK

# Run by hand: GitHub > Actions > Build Android APK > Run workflow.
# The finished app appears under Releases as spacexbot.apk.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-wrapper/**'
      - 'static/**'
      - 'backend/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-wrapper
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Build number (always higher than the last one)
        working-directory: .
        run: echo "BUILD_N=$(( ($(date +%s) - 1700000000) / 60 + 1000 ))" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check signing secrets are all set or all empty
        working-directory: .
        run: |
          n=0; for v in "$KS_B64" "$KS_PASS" "$KS_ALIAS" "$KEY_PASS"; do [ -n "$v" ] && n=$((n+1)); done
          if [ "$n" -ne 0 ] && [ "$n" -ne 4 ]; then echo "Only $n of the 4 signing secrets are set. Set all 4 or remove them."; exit 1; fi

      - name: Install Capacitor and create the Android project
        run: |
          mkdir -p www && echo '<!doctype html><title>spaceXBot</title>' > www/index.html
          npm install --no-audit --no-fund
          npx cap add android

      - name: Firebase file (push notifications)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS_B64" ]; then echo "$GS_B64" | base64 -d > android/app/google-services.json; echo "google-services.json written"; else echo "No GOOGLE_SERVICES_JSON_BASE64 secret: push notifications disabled in this build"; fi

      - name: Pillow (icon sizes)
        run: pip install pillow

      - name: Screen assistant cartoons (drawn from the website's own cartoons)
        working-directory: .
        continue-on-error: true
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 tools/make_screen_art.py android-wrapper/branding/art

      - name: Permissions, version, native Google sign-in, push
        run: VERSION_CODE=${{ env.BUILD_N }} VERSION_NAME=1.0.${{ env.BUILD_N }} python3 prepare.py

      - name: Build and sign
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then
            ./gradlew assembleRelease --no-daemon
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" --key-pass "pass:$KEY_PASS" --out ../spacexbot.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify ../spacexbot.apk
            echo "Signed with your own key. New versions install over old ones." >> "$GITHUB_STEP_SUMMARY"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../spacexbot.apk
            echo "WARNING: no signing key set. This APK uses a temporary key, so Google sign-in will not match your registered SHA-1. Run setup-signing.sh once." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show the SHA-1 (paste it into the Google Cloud Android client)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt" dump badging spacexbot.apk | grep -E "^package:" | tee -a "$GITHUB_STEP_SUMMARY"
          "$BT/apksigner" verify --print-certs spacexbot.apk | grep -E "SHA-1|Verified" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(stat -c%s spacexbot.apk)" -gt 1000000 || { echo "APK is too small, something went wrong"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: spacexbot-apk
          path: android-wrapper/spacexbot.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ env.BUILD_N }}
          name: spaceXBot app ${{ env.BUILD_N }}
          body: "Install spacexbot.apk on your Android phone."
          make_latest: true
          files: android-wrapper/spacexbot.apk
