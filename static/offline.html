<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>spaceXBot</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#10151E;color:#EAF0FA;font:600 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:24px;text-align:center}
main{max-width:360px;display:grid;gap:14px;justify-items:center}
.ring{width:64px;height:64px;border-radius:50%;border:5px solid #1A2130;border-top-color:#4CD97B;animation:s 1.1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.ring{animation:none}}
h1{margin:6px 0 0;font-size:24px;font-weight:900}p{margin:0;color:#9FB0C8;font-weight:600}
button{margin-top:6px;font:inherit;font-weight:800;color:#0B1F12;background:#4CD97B;border:0;border-radius:14px;padding:12px 22px;cursor:pointer}
small{color:#7F90A8;font-weight:600}
</style></head><body><main>
<div class="ring" aria-hidden="true"></div>
<h1>Getting spaceXBot ready</h1>
<p>We cannot reach the server right now. It may be waking up or updating. This usually clears in a minute or two.</p>
<button id="r" type="button">Try again</button>
<small id="s">Trying again by itself every few seconds...</small>
</main><script>
function go(){fetch("/healthz",{cache:"no-store"}).then(function(r){if(r.ok)location.reload()}).catch(function(){})}
document.getElementById("r").onclick=function(){document.getElementById("s").textContent="Checking...";go()};
setInterval(go,8000);
</script></body></html>
