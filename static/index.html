<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>spaceXBot</title>
<script>try{var _t=(JSON.parse(localStorage.getItem("sxb2")||"null")||{}).theme;document.documentElement.setAttribute("data-theme",_t==="light"?"light":"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}

/* Concept: Stripe-style landing, then an app with Airbnb card layout, Duolingo chunky playfulness and Apple-smooth motion. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F3F5F9; --line:#E3E6EE;
  --fg:#1E2330; --muted:#657089;
  --green:#1B9A47; --green-d:#13722F; --green-bright:#3CCB68; --green-soft:#E3F6EA; --on-green:#FFFFFF;
  --sky:#1C7FE0; --sky-d:#1360B0; --sky-soft:#E1EFFD;
  --sun:#F5B400; --sun-soft:#FFF3CC; --sun-ink:#7A5600;
  --berry:#E5484D; --berry-d:#B93035; --berry-soft:#FDE6E7;
  --good:#13803B; --bad:#D13A40;
  --shadow:0 6px 24px rgba(30,35,60,.10); --shadow-lg:0 24px 60px rgba(30,35,60,.18);
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --font:'Nunito',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151E; --surface:#1A2130; --surface2:#232C3F; --line:#303A52;
    --fg:#EEF1F8; --muted:#9AA5BF;
    --green:#4CD97B; --green-d:#2B9A52; --green-bright:#4CD97B; --green-soft:#143824; --on-green:#08280F;
    --sky:#5BB0FF; --sky-d:#2F7FCC; --sky-soft:#16304D;
    --sun:#FFCB3D; --sun-soft:#3E3210; --sun-ink:#FFD66B;
    --berry:#FF7377; --berry-d:#C84A4F; --berry-soft:#43202A;
    --good:#4CD97B; --bad:#FF7377;
    --shadow:0 6px 24px rgba(0,0,0,.35); --shadow-lg:0 24px 60px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151E; --surface:#1A2130; --surface2:#232C3F; --line:#303A52;
  --fg:#EEF1F8; --muted:#9AA5BF;
  --green:#4CD97B; --green-d:#2B9A52; --green-bright:#4CD97B; --green-soft:#143824; --on-green:#08280F;
  --sky:#5BB0FF; --sky-d:#2F7FCC; --sky-soft:#16304D;
  --sun:#FFCB3D; --sun-soft:#3E3210; --sun-ink:#FFD66B;
  --berry:#FF7377; --berry-d:#C84A4F; --berry-soft:#43202A;
  --good:#4CD97B; --bad:#FF7377;
  --shadow:0 6px 24px rgba(0,0,0,.35); --shadow-lg:0 24px 60px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
html{overflow-x:clip}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;font-weight:600;
  padding-block:0 100px;overflow-x:clip;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:900;letter-spacing:-.02em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)}
.wrap{max-width:1120px;margin:0 auto;min-width:0}

/* ---------- chunky buttons (Duolingo feel) ---------- */
.btn{
  border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:16px;padding:12px 20px;
  font-weight:900;font-size:14px;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 4px 0 var(--line);
  transition:transform .12s var(--ease),box-shadow .12s var(--ease),filter .2s;
}
.btn:hover{filter:brightness(1.03)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green);box-shadow:0 4px 0 var(--green-d)}
.btn.primary:active{box-shadow:0 0 0 var(--green-d)}
.btn.sky{background:var(--sky);border-color:var(--sky);color:#fff;box-shadow:0 4px 0 var(--sky-d)}
.btn.sky:active{box-shadow:0 0 0 var(--sky-d)}
.btn.block{width:100%}
.btn.big{padding:15px 26px;font-size:15px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.icon-btn{width:42px;height:42px;border-radius:14px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:0 3px 0 var(--line);transition:transform .12s var(--ease)}
.icon-btn:active{transform:translateY(3px);box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.demo,.chip.watch{background:var(--sun-soft);color:var(--sun-ink)}
.chip.ok{background:var(--green-soft);color:var(--good)}
.chip.stop{background:var(--berry-soft);color:var(--bad)}
.chip.info{background:var(--sky-soft);color:var(--sky)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}

/* ---------- shell ---------- */
.top{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding-top:14px;position:relative;z-index:3}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;letter-spacing:-.03em;background:none;border:0;padding:0}
.top-actions{display:flex;align-items:center;gap:8px}
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
}
.nav button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:7px 2px;border-radius:14px;font-size:11px;font-weight:800;color:var(--muted);transition:background .25s var(--ease),color .25s,transform .2s var(--spring)}
.nav button:active{transform:scale(.92)}
.nav button[aria-current="page"]{color:var(--green);background:var(--green-soft)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
body.welcome .nav,body.welcome #botPill,body.welcome .app-only{display:none}
body:not(.welcome) .landing-only{display:none}

.view{display:none;gap:18px;min-width:0;padding-top:16px}
.view.on{display:grid}
.view.on>*{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.grid2{display:grid;gap:18px;grid-template-columns:1fr;min-width:0}
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px;min-width:0;display:grid;gap:14px;align-content:start}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-head h2{font-size:19px}
.note{font-size:13px;color:var(--muted);font-weight:600}
.callout{border-radius:16px;padding:12px 14px;background:var(--sun-soft);color:var(--sun-ink);font-size:14px;font-weight:700}
.seg{display:inline-flex;background:var(--surface2);border-radius:14px;padding:4px;gap:2px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:11px;font-size:13px;font-weight:800;color:var(--muted);transition:background .25s var(--ease),color .25s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px rgba(20,25,50,.18)}

/* ---------- home ---------- */
.buddy-card{grid-template-columns:auto 1fr;align-items:center;gap:16px;background:linear-gradient(135deg,var(--green-soft),var(--sky-soft));border-color:transparent}
.bubble{position:relative;background:var(--surface);border-radius:18px;padding:12px 14px;font-weight:700;box-shadow:var(--shadow)}
.bubble::before{content:"";position:absolute;left:-7px;top:22px;width:14px;height:14px;background:var(--surface);transform:rotate(45deg);border-radius:3px}
.buddy{width:84px;height:92px;animation:bob 3.2s ease-in-out infinite}
.buddy .eye{transform-origin:center;transform-box:fill-box;animation:blink 4.5s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.buddy-actions{grid-column:1/-1;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.equity{font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1.05}
.chart{width:100%;min-height:200px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s var(--ease) .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fadein{animation:fade .9s var(--ease) .3s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pop{transform-box:fill-box;transform-origin:center;animation:popin .5s var(--spring) 1s both}
@keyframes popin{from{transform:scale(0)}to{transform:scale(1)}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:var(--surface2);border-radius:18px;padding:14px;display:grid;gap:2px}
.stat span{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.stat b{font-size:24px;font-weight:900}
.streak{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.flame{width:54px;height:54px;border-radius:18px;background:var(--sun-soft);display:grid;place-items:center}
.flame svg{width:30px;height:30px}
.goal{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:16px;border:2px solid var(--line);background:var(--surface);text-align:left;width:100%}
.goal.done{background:var(--green-soft);border-color:transparent}
button.goal:active{transform:scale(.98)}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:background .3s var(--spring),transform .3s var(--spring)}
.goal.done .tick{background:var(--green);border-color:var(--green);transform:scale(1.08)}
.tick svg{width:16px;height:16px;stroke:var(--on-green);fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.goal.done .tick svg{opacity:1}
.bar{height:16px;border-radius:99px;background:var(--surface2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--green-bright);border-radius:99px;position:relative;transition:width .9s var(--ease)}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:99px;background:rgba(255,255,255,.35)}
.bar.warn i{background:var(--sun)} .bar.bad i{background:var(--berry)}
.gate{display:grid;gap:7px;padding:12px 0;border-top:2px solid var(--line)}
.gate:first-child{border-top:0;padding-top:0}
.gate-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.gate small{color:var(--muted);font-size:13px;font-weight:700}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:2px 12px;align-items:center;padding:12px 0;border-top:2px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .ic{grid-row:1/3;width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.row .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.row .ic.up{background:var(--green-soft);color:var(--good)} .row .ic.dn{background:var(--berry-soft);color:var(--bad)} .row .ic.nw{background:var(--sky-soft);color:var(--sky)}
.row .t{font-weight:800;min-width:0;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted);grid-column:2;font-weight:700}
.row .r{grid-column:3;grid-row:1;text-align:right;font-weight:800}
.row .r2{grid-column:3;grid-row:2;text-align:right;font-size:13px;color:var(--muted)}
ul.list{margin:0;padding:0;list-style:none}

/* ---------- market (Airbnb layout) ---------- */
.searchbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 8px 6px 18px;box-shadow:var(--shadow)}
.searchbar svg{flex:none;width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:2.4;stroke-linecap:round}
.searchbar input{flex:1;min-width:0;border:0;background:none;outline:0;font-weight:700;padding:8px 0}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 10px;margin:0 -2px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:grid;justify-items:center;gap:4px;border:0;background:none;padding:8px 14px 6px;color:var(--muted);font-size:13px;font-weight:800;border-bottom:3px solid transparent;transition:color .2s,border-color .2s}
.cat svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cat[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
.cards{display:grid;gap:22px 18px;grid-template-columns:1fr}
.pcard{text-align:left;border:0;background:none;padding:0;display:grid;gap:10px;min-width:0;width:100%;color:inherit;font:inherit;transition:transform .35s var(--ease)}
.pcard:hover{transform:translateY(-4px)}
.pcard:active{transform:scale(.98)}
.pthumb{position:relative;border-radius:22px;aspect-ratio:16/10;overflow:hidden;background:var(--sky-soft)}
.pthumb.buy{background:var(--green-soft)} .pthumb.sell{background:var(--berry-soft)}
.pthumb svg.spark{position:absolute;inset:0;width:100%;height:100%}
.pbadge{position:absolute;left:12px;top:12px;background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:900;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.fav{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.75);display:grid;place-items:center;backdrop-filter:blur(6px);transition:transform .3s var(--spring)}
.fav:active{transform:scale(.8)}
.fav svg{width:20px;height:20px;fill:transparent;stroke:#1E2330;stroke-width:2.2;stroke-linejoin:round;transition:fill .2s}
.fav[aria-pressed="true"] svg{fill:var(--berry);stroke:var(--berry)}
.pmeta{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pmeta b{font-size:17px;font-weight:900}
.psub{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);font-weight:700}
.rsi{position:relative;height:14px;border-radius:99px;background:linear-gradient(90deg,var(--green-soft) 0 30%,var(--surface2) 30% 70%,var(--berry-soft) 70% 100%)}
.rsi i{position:absolute;top:-4px;left:0;width:8px;height:22px;border-radius:5px;background:var(--fg);transform:translateX(-50%);transition:left 1s var(--ease)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin:0}
.kv dt{color:var(--muted);font-size:14px;font-weight:700}
.kv dd{margin:0;text-align:right;font-weight:800;min-width:0}

/* sheet (Apple-style spring) */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:grid;align-items:end;justify-items:center}
.sheet-wrap[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(10,14,28,.5);opacity:0;transition:opacity .35s var(--ease)}
.sheet{position:relative;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;transform:translateY(105%);transition:transform .55s var(--ease);box-shadow:var(--shadow-lg);margin-left:max(0px,env(safe-area-inset-left,0px));margin-right:max(0px,env(safe-area-inset-right,0px))}
.sheet-wrap.open .backdrop{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.grab{width:44px;height:5px;border-radius:99px;background:var(--line);justify-self:center}

/* floating pill (Airbnb "map" pill) */
#botPill{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:18;border:0;border-radius:999px;background:var(--fg);color:var(--bg);padding:12px 20px;display:flex;align-items:center;gap:10px;font-weight:900;font-size:14px;box-shadow:var(--shadow-lg);transition:transform .3s var(--spring)}
#botPill:active{transform:translateX(-50%) scale(.94)}
#botPill .dot.run{background:var(--green-bright);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(60,203,104,.6)}100%{box-shadow:0 0 0 10px rgba(60,203,104,0)}}

/* ---------- bot / forms ---------- */
.opt{display:grid;grid-template-columns:48px 1fr;gap:2px 14px;align-items:center;padding:14px;border:2px solid var(--line);border-radius:20px;background:var(--surface);text-align:left;width:100%;box-shadow:0 4px 0 var(--line);transition:transform .12s var(--ease),border-color .2s,background .2s}
.opt:active{transform:translateY(4px);box-shadow:none}
.opt[aria-checked="true"]{border-color:var(--sky);background:var(--sky-soft);box-shadow:0 4px 0 var(--sky)}
.opt .ic{grid-row:1/3;width:48px;height:48px;border-radius:16px;background:var(--surface2);display:grid;place-items:center;color:var(--sky)}
.opt .ic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.opt b{font-weight:900;font-size:16px}
.opt small{color:var(--muted);font-size:13px;font-weight:700}
.inp-row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:800;color:var(--muted)}
.inp{width:100%;border:2px solid var(--line);background:var(--surface2);border-radius:14px;padding:12px 14px;font-weight:800;font-size:16px;transition:border-color .2s,background .2s}
.inp:focus{outline:0;border-color:var(--sky);background:var(--surface)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border:0;border-top:2px solid var(--line);width:100%;background:none;text-align:left}
.switch:first-child{border-top:0;padding-top:0}
.switch b{font-weight:800}
.switch small{display:block;color:var(--muted);font-size:13px;font-weight:700}
.sw{flex:none;width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:background .3s var(--ease)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .4s var(--spring)}
.switch[aria-checked="true"] .sw{background:var(--green-bright)}
.switch[aria-checked="true"] .sw::after{transform:translateX(22px)}
.result{background:var(--green-soft);border-radius:18px;padding:14px;display:grid;gap:4px}
.result b{font-size:30px;font-weight:900}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.pick{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 16px 10px 10px;font-weight:900;box-shadow:0 4px 0 var(--line);transition:transform .12s var(--ease)}
.pick:active{transform:translateY(4px);box-shadow:none}
.pick .lg{width:32px;height:32px;border-radius:50%;background:var(--sky-soft);color:var(--sky);display:grid;place-items:center;font-size:13px;font-weight:900}
.pick[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);box-shadow:0 4px 0 var(--green)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;counter-increment:s}
.steps li::before{content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--sky);color:#fff;display:grid;place-items:center;font-weight:900;box-shadow:0 3px 0 var(--sky-d)}
.steps b{display:block;font-weight:900}
.steps span{color:var(--muted);font-weight:600;font-size:15px}
code{font-size:13px;background:var(--surface2);padding:1px 7px;border-radius:8px;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:14px;font-size:14px;font-weight:800;z-index:50;max-width:calc(100% - 32px);animation:rise .4s var(--ease)}
.confetti{position:fixed;width:10px;height:14px;border-radius:3px;z-index:60;pointer-events:none}

  <button data-go="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>
  <button data-go="signals"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Signals</button>
  <button data-go="bot"><svg class="mk" width="24" height="24" aria-hidden="true"><use href="#mk"/></svg>Bot</button>
  <button data-go="plans"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 11h18"/></svg>Plan</button>
 </nav>
 <div class="top-actions">
  <span class="chip app-only" id="who"></span>
  <button class="icon-btn" id="themeBtn" aria-label="Change theme"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  <button class="icon-btn app-only" id="outBtn" aria-label="Sign out"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/></svg></button>
 </div>
</header>

<section class="view on" id="view-welcome"><div class="card" style="max-width:460px;margin:8vh auto 0;text-align:center;justify-items:center">
 <svg class="mk" width="84" height="84" aria-hidden="true"><use href="#mk"/></svg>
 <h1>spaceXBot</h1><p class="muted">Signals and auto-trading for MetaTrader 5.</p>
 <button class="btn primary big block" id="gBtn">Sign in with Google</button><p class="err" id="err"></p></div></section>

<section class="view" id="view-home">
 <div class="card"><div class="card-head"><h2>Net result</h2><span class="chip" id="botChip"></span></div>
  <div class="equity num" id="net">$0.00</div><div class="note num" id="netSub"></div><div id="spark"></div></div>
 <div class="stats" id="stats"></div>
 <div class="card"><div class="card-head"><h2>Open trades</h2><span class="chip info" id="openCount"></span></div><ul class="list" id="openList"></ul></div>
 <div class="card"><div class="card-head"><h2>Safety gates</h2></div><div id="gates"></div></div>
</section>

<section class="view" id="view-signals">
 <div class="card"><div class="card-head"><h2>Signals</h2><div class="seg" id="sFilter"></div></div><ul class="list" id="sList"></ul></div>
</section>

<section class="view" id="view-bot">
 <div class="card"><div class="card-head"><h2>Bot</h2><span class="chip" id="botChip2"></span></div><p class="note" id="botWhy"></p>
  <button class="btn block" id="botToggle" hidden></button><button class="btn block" id="pushBtn">Turn on notifications</button></div>
 <div class="card"><div class="card-head"><h2>Strategies</h2></div><div id="strats"></div></div>
 <div class="card" id="adm" hidden><div class="card-head"><h2>Admin settings</h2></div><div class="grid2" id="setF"></div>
  <button class="btn primary block" id="setSave">Save settings</button></div>
 <div class="card" id="adm2" hidden><div class="card-head"><h2>Give access</h2></div>
  <div class="field"><label for="gEm">User email</label><input class="inp" id="gEm" type="email"></div>
  <div class="field"><label for="gDays">Days</label><input class="inp" id="gDays" type="number" value="30"></div>
  <button class="btn block" id="gGo">Grant</button></div>
 <div class="card" id="adm3" hidden><div class="card-head"><h2>Plans (JSON)</h2></div><textarea class="inp" id="plJson" rows="8" spellcheck="false"></textarea>
  <button class="btn block" id="plSave">Save plans</button></div>
</section>

<section class="view" id="view-plans">
 <div class="card"><div class="card-head"><h2>Choose a plan</h2><span class="chip" id="planChip"></span></div><div id="plList" style="display:grid;gap:10px"></div>
  <div class="field"><label for="ph">M-Pesa phone</label><input class="inp" id="ph" inputmode="tel" placeholder="07XX XXX XXX"></div>
  <button class="btn primary block" id="payM">Pay with M-Pesa</button><button class="btn sky block" id="payP">Pay with PayPal</button>
  <p class="note" id="payMsg"></p></div>
</section>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="/config.js"></script>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import{getMessaging,getToken}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m2=v=>(v>=0?'+':'-')+'$'+Math.abs(v).toFixed(2);
const toast=t=>{const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3000)};
const UP='<svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg>',DN='<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 9v8H9"/></svg>';
const app=initializeApp(SXB.fb),auth=getAuth(app);
let ME=null,D={sig:[],st:{},sx:{summary:{},by_strategy:{}}},F='all',SEL=null,PLANS=[],tm=0;
const api=async(p,b)=>{try{const t=await auth.currentUser.getIdToken();const r=await fetch('/api'+p,{method:b?'POST':'GET',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});let j=null;try{j=await r.json()}catch(e){}return{s:r.status,j}}catch(e){return{s:0,j:null}}};
const cur=()=>location.hash.slice(1)||'home';
function show(v){if(!ME)v='welcome';else if(!ME.active)v='plans';else if(v==='welcome')v='home';
 $$('.view').forEach(x=>x.classList.toggle('on',x.id==='view-'+v));$$('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.go===v?'page':'false'));
 document.body.classList.toggle('welcome',v==='welcome');if(location.hash!=='#'+v)history.replaceState(0,'','#'+v);scrollTo(0,0)}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)show(g.dataset.go)});
$('#themeBtn').onclick=()=>{const t=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('sxb2',JSON.stringify({theme:t}))}catch(e){}};
$('#gBtn').onclick=async()=>{$('#err').textContent='';const p=new GoogleAuthProvider();try{await signInWithPopup(auth,p)}catch(e){if(e.code==='auth/unauthorized-domain')$('#err').textContent='Add this domain in Firebase > Authentication > Settings > Authorized domains.';else try{await signInWithRedirect(auth,p)}catch(x){$('#err').textContent='Sign-in failed. Try again.'}}};
$('#outBtn').onclick=()=>signOut(auth);
getRedirectResult(auth).catch(()=>{});

async function load(){
 const m=await api('/me');
 if(m.s===401){$('#err').textContent='The server could not verify your login. Check FIREBASE_SERVICE_ACCOUNT on Render.';await signOut(auth);return false}
 if(m.s!==200)return false;ME=m.j;$('#who').textContent=ME.email+(ME.admin?' · admin':'');
 if(!ME.active){drawPlans();return true}
 const[a,b,c]=await Promise.all([api('/signals'),api('/status'),api('/stats')]);
 D={sig:a.j||[],st:b.j||{},sx:c.j||{summary:{},by_strategy:{}}};draw();return true}

const ago=t=>{const s=Math.max(0,Date.now()/1e3-t);return s<3600?Math.round(s/60)+'m ago':s<86400?Math.round(s/3600)+'h ago':Math.round(s/86400)+'d ago'};
const row=s=>{const buy=s.side==='buy',pl=s.pnl,cl=s.status==='closed';
 return'<li class="row"><span class="ic '+(buy?'up':'dn')+'">'+(buy?UP:DN)+'</span><span class="t">'+esc(s.symbol)+' '+esc(s.side)+'</span><span class="r num '+(cl?(pl>=0?'good':'bad'):'muted')+'">'+(cl&&pl!=null?m2(pl):esc(s.status))+'</span><span class="s">'+esc(s.entry)+' · SL '+esc(s.sl)+' · TP '+esc(s.tp)+' · '+esc(s.strategy)+' · '+ago(s.created)+'</span></li>'};
function draw(){
 const{sig,st,sx}=D,sm=sx.summary||{},open=sig.filter(s=>['open','sent','pending'].includes(s.status)),closed=sig.filter(s=>s.status==='closed'&&s.pnl!=null);
 const net=sm.net||0;$('#net').textContent=m2(net);$('#net').className='equity num '+(net>=0?'good':'bad');
 $('#netSub').textContent=(sm.trades||0)+' closed trades'+(ME.today?' · today '+m2(ME.today.pnl||0):'')+(ME.admin&&ME.account&&ME.account.balance!=null?' · balance $'+Number(ME.account.balance).toFixed(2):'');
 const state=!st.ea_online?'EA offline':!st.bot?'Bot paused':!st.can_trade?'Blocked':'Running',ok=state==='Running';
 ['#botChip','#botChip2'].forEach(i=>{$(i).className='chip '+(ok?'ok':state==='Bot paused'?'':'watch');$(i).innerHTML='<span class="dot"></span>'+state});
 $('#botWhy').textContent=(st.why&&!st.can_trade?'Reason: '+st.why+'. ':'')+(st.demo===false?'LIVE account connected.':st.demo?'Demo account connected.':'No account connected yet. Attach the EA in MT5.');
 let c=0,pts=closed.slice().reverse().map(s=>c+=s.pnl);if(pts.length>1){const mn=Math.min(0,...pts),mx=Math.max(0,...pts),r=mx-mn||1,W=300,H=90,X=i=>i*W/(pts.length-1),Y=v=>H-6-(v-mn)/r*(H-12);
  $('#spark').innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="110" preserveAspectRatio="none"><path d="'+pts.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('')+'" fill="none" stroke="'+(net>=0?'var(--green)':'var(--berry)')+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>'}else $('#spark').innerHTML='<p class="note">The curve appears after your first closed trades.</p>';
 $('#stats').innerHTML=[['Win rate',(sm.win_rate||0)+'%'],['Profit factor',sm.profit_factor==null?'-':sm.profit_factor],['Max drawdown','$'+(sm.max_drawdown||0)],['Open trades',(st.open||0)+' of '+(st.max_open||0)]].map(s=>'<div class="stat"><span>'+s[0]+'</span><b class="num">'+s[1]+'</b></div>').join('');
 $('#openCount').textContent=open.length+' open';$('#openList').innerHTML=open.map(row).join('')||'<li class="row"><span class="s">No open trades.</span></li>';
 const g=[],dl=st.day_loss_limit||1,nh=st.news_next,ex=Object.entries(st.exposure||{}).filter(e=>e[1]).map(e=>e[0]+' '+(e[1]>0?'+':'')+e[1]).join(', ');
 g.push(['Daily loss limit',(st.day_loss_pct||0)/dl,(st.day_loss_pct||0)+'% of '+dl+'% used',(st.day_loss_pct||0)>=dl?'stop':'ok']);
 g.push(['Open trades',(st.open||0)/(st.max_open||1),(st.open||0)+' of '+(st.max_open||0)+' slots',(st.open||0)>=(st.max_open||1)?'watch':'ok']);
 g.push(['News lock',nh?Math.max(0,1-nh.in_min/240):0,!st.news_lock?'Off':nh?esc(nh.ccy)+' '+esc(nh.title)+' in '+nh.in_min+' min':st.news_loaded?'No high-impact news':'News feed not loaded',nh&&nh.in_min<=30&&st.news_lock?'stop':'ok']);
 g.push(['Currency exposure',0,ex||'No net exposure','ok']);
 $('#gates').innerHTML=g.map(x=>'<div class="gate"><div class="gate-top"><b>'+x[0]+'</b><span class="chip '+({ok:'ok',watch:'watch',stop:'stop'})[x[3]]+'">'+({ok:'Clear',watch:'Watch',stop:'Locked'})[x[3]]+'</span></div><div class="bar '+({ok:'',watch:'warn',stop:'bad'})[x[3]]+'"><i style="width:'+Math.min(100,Math.max(4,Math.round(x[1]*100)))+'%"></i></div><small>'+x[2]+'</small></div>').join('');
 $('#sFilter').innerHTML=[['all','All'],['open','Open'],['win','Wins'],['loss','Losses']].map(f=>'<button type="button" data-f="'+f[0]+'" aria-pressed="'+(F===f[0])+'">'+f[1]+'</button>').join('');
 const L=sig.filter(s=>F==='all'||(F==='open'?['open','sent','pending'].includes(s.status):F==='win'?s.status==='closed'&&s.pnl>0:s.status==='closed'&&s.pnl<=0));
 $('#sList').innerHTML=L.map(row).join('')||'<li class="row"><span class="s">No signals yet.</span></li>';
 const off=st.off||[],bs=sx.by_strategy||{};
 $('#strats').innerHTML=(st.strategies||[]).map(n=>{const b=bs[n],isOff=off.includes(n);return'<div class="gate"><div class="gate-top"><b>'+esc(n)+'</b>'+(ME.admin?'<button class="btn sw" data-st="'+esc(n)+'">'+(isOff?'Off':'On')+'</button>':'<span class="chip '+(isOff?'':'ok')+'">'+(isOff?'Off':'On')+'</span>')+'</div><small>'+(b?b.n+' trades · '+b.win_rate+'% wins · '+m2(b.pnl):'No closed trades yet')+'</small></div>'}).join('');
 const bt=$('#botToggle');bt.hidden=!ME.admin;bt.textContent=st.bot?'Pause bot':'Start bot';bt.className='btn block '+(st.bot?'':'primary');
 ['adm','adm2','adm3'].forEach(i=>$('#'+i).hidden=!ME.admin);
 if(ME.admin&&!$('#setF').children.length&&ME.settings){$('#setF').innerHTML=['risk_pct','max_open','max_trades_day','max_daily_loss_pct','max_weekly_loss_pct','rr','min_confluence','cooldown_min','news_lock','symbols'].map(k=>'<div class="field"><label>'+k+'</label><input class="inp" data-k="'+k+'" value="'+esc(ME.settings[k])+'"></div>').join('')}}
document.addEventListener('click',async e=>{
 const f=e.target.closest('[data-f]');if(f){F=f.dataset.f;draw()}
 const s=e.target.closest('[data-st]');if(s){const n=s.dataset.st,o=new Set(D.st.off||[]);o.has(n)?o.delete(n):o.add(n);const r=await api('/admin/settings',{strategies_off:[...o].join(',')});toast(r.s===200?'Saved':'Failed');load()}});
$('#botToggle').onclick=async()=>{const r=await api('/admin/settings',{bot_enabled:D.st.bot?'0':'1'});toast(r.s===200?'Saved':'Failed');load()};
$('#setSave').onclick=async()=>{const b={};$$('#setF [data-k]').forEach(i=>b[i.dataset.k]=i.value);const r=await api('/admin/settings',b);toast(r.s===200?'Settings saved':'Failed');if(r.s===200){ME.settings=r.j;load()}};
$('#gGo').onclick=async()=>{const r=await api('/admin/grant',{email:$('#gEm').value.trim(),days:+$('#gDays').value});toast(r.s===200?'Access granted':(r.j&&r.j.error)||'Failed')};
$('#plSave').onclick=async()=>{let p;try{p=JSON.parse($('#plJson').value)}catch(e){return toast('Plans JSON is not valid')}const r=await api('/admin/plans',{plans:p});toast(r.s===200?'Plans saved':'Failed');if(r.s===200){PLANS=r.j;drawPlans()}};
$('#pushBtn').onclick=async()=>{try{if(await Notification.requestPermission()!=='granted')return toast('Notifications blocked');const reg=await navigator.serviceWorker.register('/firebase-messaging-sw.js');const t=await getToken(getMessaging(app),{vapidKey:SXB.vapid,serviceWorkerRegistration:reg});await api('/me/fcm',{token:t});toast('Notifications on')}catch(e){toast('Could not turn on notifications')}};

async function drawPlans(){
 if(!PLANS.length)try{PLANS=await(await fetch('/api/plans')).json()}catch(e){}
 if(!SEL&&PLANS.length)SEL=(PLANS.find(p=>p.pop)||PLANS[0]).id;
 $('#planChip').textContent=ME&&ME.active?'Active until '+new Date(ME.plan_until*1e3).toLocaleDateString():'No active plan';
 $('#plList').innerHTML=PLANS.map(p=>'<button type="button" class="pl" data-p="'+esc(p.id)+'" aria-pressed="'+(SEL===p.id)+'"><span><b>'+esc(p.name)+'</b><br><small class="muted">'+p.days+' days</small></span><b class="num">KES '+p.kes+' · $'+p.usd+'</b></button>').join('')||'<p class="note">No plans yet.</p>';
 if(ME&&ME.admin)$('#plJson').value=JSON.stringify(PLANS,null,1)}
$('#plList').onclick=e=>{const b=e.target.closest('[data-p]');if(b){SEL=b.dataset.p;drawPlans()}};
$('#payM').onclick=async()=>{let n=$('#ph').value.replace(/\D/g,'').replace(/^0/,'254').replace(/^([17]\d{8})$/,'254$1');if(!/^254[17]\d{8}$/.test(n))return $('#payMsg').textContent='Enter a valid Safaricom number, like 0712 345 678.';
 $('#payMsg').textContent='Sending the M-Pesa prompt...';const r=await api('/pay/mpesa',{plan:SEL,phone:n});if(r.s!==200)return $('#payMsg').textContent=(r.j&&r.j.error)||'Could not start payment.';
 $('#payMsg').textContent='Check your phone and enter your M-Pesa PIN.';let k=0;const iv=setInterval(async()=>{const s=await api('/pay/status?ref='+encodeURIComponent(r.j.ref));k++;
  if(s.j&&s.j.status==='paid'){clearInterval(iv);toast('Payment received');await load();show('home')}else if(s.j&&s.j.status==='failed'){clearInterval(iv);$('#payMsg').textContent='Payment failed'+(s.j.reason?': '+s.j.reason:'')+'.'}else if(k>40){clearInterval(iv);$('#payMsg').textContent='Still waiting. If you paid, your plan activates in a minute.'}},4000)};
$('#payP').onclick=async()=>{const r=await api('/pay/paypal',{plan:SEL});if(r.s===200&&r.j.url)location.href=r.j.url;else toast((r.j&&r.j.error)||'PayPal is unavailable')};

onAuthStateChanged(auth,async u=>{clearInterval(tm);
 if(!u){ME=null;show('welcome');return}
 if(await load()){const q=new URLSearchParams(location.search).get('paid');if(q){history.replaceState(0,'','/');toast(q==='ok'?'Payment received. Plan active.':'Payment not completed.');await load()}
  show(['welcome','plans'].includes(cur())&&ME.active?'home':cur());tm=setInterval(()=>ME&&ME.active&&load(),15000)}else show('welcome')});
show('welcome');
</script>
</body></html>
